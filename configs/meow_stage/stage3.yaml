# @package _global_
# MEOW Stage 3: camera-sampled tuples from second-generation scenes (training ROOT and
# splits point at the second-generation shards; the validation sets stay on first-generation
# scenes), one resolution bucket per tuple, the solid-angle weighted loss with the
# von Mises-Fisher ray likelihood, and the panorama wrap of the dense head; one warm-up epoch.
defaults:
  - override /machine: meow
  - override /dataset: procthor_unicol_518_many_ar
  - override /loss: overall_loss_solid_angle_vmf
  - override /model: mapanything
  - override /model/task: aug_training
  - override /train_params: lower_encoder_lr

dataset:
  num_views: 8
  train:
    variable_num_views: True
  procthor_unicol:
    train:
      n5_sampling: true
      n5_sampling_v2: true
      n5_v2_tier_weights: [0.0, 0.5, 0.5]
      preserve_info_resize: True
      variable_resolution: False
      camera_sampling: True
      camera_sampling_p: 1.0
      camera_sampling_retries: 1
      photo_mtf_p: 0.5
      photo_mtf_vmin: 0.35
      # second-generation scenes have no flat-wall statistics
      frame_stats_path: ''
    val:
      preserve_info_resize: True
      n5_sampling: true
      n5_sampling_v2: true
      n5_v2_tier_weights: [0.0, 0.5, 0.5]
  test_dataset: "+ 64 @ ${dataset.procthor_unicol.val.dataset_str} + 48 @ ${dataset.procthor_unicol.val_camera_sampled.dataset_str}"

model:
  task:
    ar_prob: 1.0
    ar_fuse_mode: additive
  encoder:
    uses_torch_hub: true
    torch_hub_pretrained: False
    gradient_checkpointing: true
  info_sharing:
    module_args:
      gradient_checkpointing: true
  pred_head:
    gradient_checkpointing: true
  model_config:
    variable_resolution: False
    pano_wrap_dpt: true
    pretrained_checkpoint_path: ???

train_params:
  resume: True
  epochs: 15
  warmup_epochs: 1
  lr: 1.6e-5
  min_lr: 1.6e-7
  submodule_configs:
    encoder:
      lr: 8e-7
      min_lr: 8e-9
  print_freq: 10
  keep_freq: 25
  save_freq: 1
  eval_freq: 1
  feature_weights_schedule:
    - {epoch_start: 0, weights: {0: 0.0, 1: 0.0, 2: 1.0, 3: 0.0, 4: 0.0, 5: 0.0, 6: 0.0}}
    - {epoch_start: 1, weights: {0: 0.0009, 1: 0.0013, 2: 0.9907, 3: 0.002, 4: 0.002, 5: 0.0016, 6: 0.0015}}
    - {epoch_start: 2, weights: {0: 0.0035, 1: 0.0052, 2: 0.9631, 3: 0.0078, 4: 0.0078, 5: 0.0065, 6: 0.0061}}
    - {epoch_start: 3, weights: {0: 0.0076, 1: 0.0115, 2: 0.9188, 3: 0.0172, 4: 0.0172, 5: 0.0143, 6: 0.0134}}
    - {epoch_start: 4, weights: {0: 0.0132, 1: 0.0199, 2: 0.8593, 3: 0.0298, 4: 0.0298, 5: 0.0248, 6: 0.0232}}
    - {epoch_start: 5, weights: {0: 0.02, 1: 0.03, 2: 0.7875, 3: 0.045, 4: 0.045, 5: 0.0375, 6: 0.035}}
    - {epoch_start: 6, weights: {0: 0.0276, 1: 0.0415, 2: 0.7063, 3: 0.0622, 4: 0.0622, 5: 0.0518, 6: 0.0484}}
    - {epoch_start: 7, weights: {0: 0.0358, 1: 0.0537, 2: 0.6194, 3: 0.0806, 4: 0.0806, 5: 0.0672, 6: 0.0627}}
    - {epoch_start: 8, weights: {0: 0.0442, 1: 0.0663, 2: 0.5306, 3: 0.0994, 4: 0.0994, 5: 0.0828, 6: 0.0773}}
    - {epoch_start: 9, weights: {0: 0.0524, 1: 0.0785, 2: 0.4437, 3: 0.1178, 4: 0.1178, 5: 0.0982, 6: 0.0916}}
